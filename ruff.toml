line-length = 120

[lint]
preview = true
select = [
	"PL",  # Pylint
	"I",  # Isort
	"FA",  # Flake8: future-annotations
	"UP",  # Pyupgrade
	"RUF",  # Ruff specific
	"F",  # Flake8 core
	"ASYNC",  # Flake8 async
	"ISC",  # flake8-implicit-str-concat
    "TID",  # flake8-tidy-imports
	"E",
	"W",
]
explicit-preview-rules = false
ignore = [
    # Pylint convention
    "import-outside-top-level",
    "compare-to-empty-string",
    # Should probably fix these
    "unnecessary-dunder-call",
    "import-private-name",

    # Pylint refactor
    "too-many-statements",
    "too-many-locals",
    "too-many-arguments",
    "too-many-branches",
    "too-many-nested-blocks",
    "too-many-public-methods",
    "too-many-positional-arguments",
    "too-many-boolean-expressions",
    "too-many-return-statements",
    # Should probably fix these
    "no-self-use",
    "magic-value-comparison",
    "redefined-argument-from-local",
    "collapsible-else-if",

    # Pylint warning
    "eq-without-hash",
    # Should probably fix these
    "redefined-loop-name",
    "unspecified-encoding",
    "global-statement",

    # Flake8 async
    # Should probably fix these
    "blocking-open-call-in-async-function",
    # Should probably fix these after dealing with shielding for anyio
    "async-function-with-timeout",

    # flake8-implicit-str-concat
    "explicit-string-concatenation",

    # Ruff Specific
    # Module-level code is intentional in __init__.py files.
    "non-empty-init-module",

    # This code is problematic because using instantiated types as defaults is so common across the codebase.
    # Its purpose is to prevent accidenatally assigning mutable defaults. However, this is a bit overkill for that.
    # That being said, it would be nice to add some way to actually guard against that specific mutable default behavior.
    "function-call-in-dataclass-default-argument",
    # Should probably fix this
    "unused-async",
]


[lint.flake8-implicit-str-concat]
# Found 3279 errors.
# allow-multiline = false

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
# for use with another pr
# "asyncio.create_task".msg = "Use `from chia.util.pit import pit` and `pit.create_task()`"

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.pylint]
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-nested-blocks = 5
max-public-methods = 20
max-bool-expr = 5

[lint.pyupgrade]
keep-runtime-typing = true
